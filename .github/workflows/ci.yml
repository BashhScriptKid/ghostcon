name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly fuzz run (Mondays 04:17 UTC).
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # libghostty-vt ships in Arch's repos (package "ghostty"), not in Ubuntu's,
  # so every job runs in an Arch container. Keep this list in sync with the
  # "Requirements" section of README.md.
  ARCH_PACKAGES: >-
    base-devel git meson ninja pkgconf python clang ghostty
    libdrm mesa libglvnd libinput systemd-libs libxkbcommon
    fontconfig freetype2 harfbuzz libpng

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - name: Configure
        run: meson setup build -Dinstall_systemd_unit=false
      - name: Build
        run: ninja -C build
      - name: Fetch the UCD input
        # test_symbol_table compares the generated symbol table against the
        # Unicode Character Database. The input is fetched on demand and is
        # not committed (see .gitignore), and the test SKIPs without it --
        # so a unicode.org outage delays the check rather than breaking the
        # build.
        run: tools/fetch_ucd.sh || true
      - name: Install a font with programming ligatures
        # test_ligature needs a font with calt ligatures. It SKIPs without
        # one, so this is best-effort: the package name is not worth failing
        # the whole build over.
        run: pacman -S --noconfirm --needed ttf-jetbrains-mono-nerd || true
      - name: Test
        run: meson test -C build --print-errorlogs

  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - name: Configure
        run: meson setup build-san -Db_sanitize=address,undefined -Dinstall_systemd_unit=false
      - name: Build
        run: ninja -C build-san
      - name: Fetch the UCD input
        # test_symbol_table compares the generated symbol table against the
        # Unicode Character Database. The input is fetched on demand and is
        # not committed (see .gitignore), and the test SKIPs without it --
        # so a unicode.org outage delays the check rather than breaking the
        # build.
        run: tools/fetch_ucd.sh || true
      - name: Install a font with programming ligatures
        # test_ligature needs a font with calt ligatures. It SKIPs without
        # one, so this is best-effort: the package name is not worth failing
        # the whole build over.
        run: pacman -S --noconfirm --needed ttf-jetbrains-mono-nerd || true
      - name: Test
        run: meson test -C build-san --print-errorlogs

  format:
    name: Style checks
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed python
      - name: format
        run: python3 tools/format.py --check

  complexity:
    name: Complexity gate
    # The gate that stops a hotspot from growing back (REFACTOR_PLAN.md
    # section 7.6). Nothing else in CI notices that a function has quietly
    # become a 40-branch tangle.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed python python-pip
      - name: Install lizard
        # lizard is a measurement tool for the gate, not a repo dependency:
        # the build does not need it, and the tree does not import it.
        # Arch's Python is externally managed (PEP 668), hence the flag.
        run: pip install --break-system-packages lizard
      - name: Complexity gate
        run: python3 tools/complexity.py

  fuzz:
    name: Fuzz term parser
    # Scheduled/dispatch only: a coverage-guided run is minutes, not the
    # seconds a PR should wait on.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - name: Configure
        run: |
          CC=clang meson setup build-fuzz -Dbuild_fuzzers=true \
            -Db_sanitize=address,undefined -Db_lundef=false \
            -Dinstall_systemd_unit=false
      - name: Build fuzzer
        run: ninja -C build-fuzz src/fuzz_term
      - name: Seed corpus from existing sequence files
        run: |
          mkdir -p build-fuzz/corpus
          cp tools/corpus/*.seq build-fuzz/corpus/ 2>/dev/null || true
      - name: Fuzz
        run: ./build-fuzz/src/fuzz_term -max_len=4096 -max_total_time=120 build-fuzz/corpus
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
          if-no-files-found: ignore
